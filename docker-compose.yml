version: '3.8'

networks:
  coolify:
    external: true
  omniguard_internal:
    driver: bridge

services:
  postgres:
    image: postgres:15
    container_name: omniguard_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: omniguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - omniguard_internal
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: omniguard_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - omniguard_internal
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omniguard_backend
    env_file:
      - .env
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - DATABASE_URL=postgresql+psycopg://admin:adminpassword@postgres:5432/omniguard
    depends_on:
      - postgres
      - elasticsearch
    networks:
      - omniguard_internal
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omniguard_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - coolify
      - omniguard_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.omniguard-http.rule=Host(`omniguard.imrnes.team`)"
      - "traefik.http.routers.omniguard-http.entrypoints=http"
      - "traefik.http.routers.omniguard-http.middlewares=redirect-to-https"
      - "traefik.http.routers.omniguard-https.rule=Host(`omniguard.imrnes.team`)"
      - "traefik.http.routers.omniguard-https.entrypoints=https"
      - "traefik.http.routers.omniguard-https.tls=true"
      - "traefik.http.routers.omniguard-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.omniguard.loadbalancer.server.port=80"
      - "traefik.docker.network=coolify"
    restart: unless-stopped

volumes:
  postgres_data:
  es_data:
